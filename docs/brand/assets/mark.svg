  <path d="M15 24 H39" stroke="#4A50C4" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M15 35 H34" stroke="#4A50C4" stroke-width="3.2" stroke-linecap="round"/>
  <!-- lineage nodes; the "now"/evidence node is amber -->
  <circle cx="15" cy="13" r="2.4" fill="#4A50C4"/>
  <circle cx="15" cy="35" r="2.4" fill="#4A50C4"/>
  <circle cx="15" cy="24" r="3.1" fill="#F0B54A"/>
